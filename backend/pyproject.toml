[project]
name = "gesti-fact-api"
version = "1.0.0"
description = "API Django de Gesti-Fact"
requires-python = ">=3.12"
# Garder synchronisé avec requirements.txt (installation locale)
dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "num2words>=0.5.13",
    "Pillow>=10.4",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
# Applique les migrations sur la base Neon à chaque déploiement
build = "python manage.py migrate --noinput"
