<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Gesti-Fact</title>
    <meta name="description" content="Gesti-Fact — gestion de factures professionnelle" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F3A5F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gesti-Fact" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f4f6f9;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.error('Service Worker non enregistré :', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>Activez JavaScript pour utiliser Gesti-Fact.</noscript>
    <div id="root"></div>
  </body>
</html>
